/* CARD COMPONENT */

function SpecialtyCard({ specialty, active, onSelect, index }) {

    const cardRef = useRef(null);

    const handleMouseMove = (event) => {

        if (window.innerWidth <= 600) return;

        const card = cardRef.current;
        if (!card) return;

        const rect = card.getBoundingClientRect();

        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -4;
        const rotateY = ((x - centerX) / centerX) * 4;

        card.style.transform =
            `translateY(-9px) perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    };

    const handleMouseLeave = () => {
        if (cardRef.current) {
            cardRef.current.style.transform = "";
        }
    };

    const handleClick = (event) => {

        const rect = event.currentTarget.getBoundingClientRect();

        const ripple = document.createElement("span");
        ripple.className = "ripple";

        ripple.style.left = `${event.clientX - rect.left}px`;
        ripple.style.top = `${event.clientY - rect.top}px`;

        event.currentTarget.appendChild(ripple);

        ripple.addEventListener("animationend", () => {
            ripple.remove();
        });

        onSelect(specialty);
    };

    const handleImageError = (event) => {

        const img = event.currentTarget;

        /* first try the backup online image, then fall back to the icon */
        if (specialty.fallbackImage && img.src !== specialty.fallbackImage) {
            img.src = specialty.fallbackImage;
            return;
        }

        img.onerror = null;

        const fallback = document.createElement("div");
        fallback.className = "image-fallback";
        fallback.innerHTML = `<i class="bi ${specialty.icon}"></i>`;

        img.replaceWith(fallback);
    };

    return (
        <div
            ref={cardRef}
            className="specialty-card"
            data-index={index}
            onMouseMove={handleMouseMove}
            onMouseLeave={handleMouseLeave}
            onClick={handleClick}
            onKeyDown={(event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    onSelect(specialty);
                }
            }}
            role="button"
            tabIndex="0"
            aria-pressed={active}
        >

            <span className="shine-effect"></span>

            <div className="specialty-image-space">
                <img
                    src={specialty.image}
                    alt={`${specialty.name} medical specialty`}
                    loading="eager"
                    decoding="async"
                    onError={handleImageError}
                />
            </div>

            <h3 className="specialty-name">
                {specialty.name}
            </h3>

        </div>
    );
}


/* MAIN COMPONENT */

function MedicalSpecialties() {

    const [selectedSpecialty, setSelectedSpecialty] = useState(null);

    const gridRef = useRef(null);

    /* SCROLL REVEAL */

    useEffect(() => {

        const grid = gridRef.current;
        if (!grid) return;

        const cards = grid.querySelectorAll(".specialty-card");

        if (!("IntersectionObserver" in window)) {
            cards.forEach(card => card.classList.add("reveal"));
            return;
        }

        const observer = new IntersectionObserver((entries) => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    const card = entry.target;
                    const index = Number(card.dataset.index);

                    setTimeout(() => {
                        card.classList.add("reveal");
                    }, index * 110);

                    observer.unobserve(card);
                }

            });

        }, {
            threshold: 0.1
        });

        cards.forEach(card => observer.observe(card));

        return () => observer.disconnect();

    }, []);

    /* SELECT SPECIALTY */

    const handleSelect = (specialty) => {

        setSelectedSpecialty(specialty);

        document.dispatchEvent(
            new CustomEvent("specialtySelected", {
                detail: {
                    specialty: specialty.name,
                    id: specialty.id
                }
            })
        );

    };

    return (

        <section className="specialties-section" id="specialties">

            <div className="light-bubble bubble-one"></div>
            <div className="light-bubble bubble-two"></div>
            <div className="light-bubble bubble-three"></div>

            <div className="stethoscope-position"></div>
            <div className="leaves-position"></div>

            <div className="specialties-container">

                <div className="section-heading">
                    <div className="heading-line"></div>
                    <h2 className="section-title">Medical Specialties</h2>
                    <div className="heading-line right"></div>
                </div>

                <p className="section-subtitle">
                    Explore our medical departments
                </p>

                <div className="specialties-grid" ref={gridRef}>
                    {specialtiesData.map((specialty, index) => (
                        <SpecialtyCard
                            key={specialty.id}
                            specialty={specialty}
                            index={index}
                            active={selectedSpecialty?.id === specialty.id}
                            onSelect={handleSelect}
                        />
                    ))}
                </div>

                <div
                    className={`selection-message ${selectedSpecialty ? "show" : ""}`}
                    aria-live="polite"
                >
                    <i className="bi bi-check-circle-fill"></i>
                    Selected Specialty:
                    <strong>{selectedSpecialty?.name}</strong>
                </div>

            </div>

            <div className="bottom-decoration"></div>

        </section>

    );
}

/* APPOINTMENT MODAL */

function AppointmentModal({ doctor, onClose }) {

    const [submitted, setSubmitted] = useState(false);
    const [name, setName] = useState("");
    const [email, setEmail] = useState("");
    const [date, setDate] = useState("");

    useEffect(() => {

        function handleEscape(e) {
            if (e.key === "Escape") onClose();
        }

        document.addEventListener("keydown", handleEscape);

        return () => {
            document.removeEventListener("keydown", handleEscape);
        };

    }, [onClose]);

    if (!doctor) return null;

    function handleSubmit(e) {
        e.preventDefault();

        if (!name.trim() || !email.trim() || !date) return;

        setSubmitted(true);
    }

    return (

        <div
            className="appointment-overlay"
            onClick={onClose}
        >

            <div
                className="appointment-modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="appointment-title"
                onClick={e => e.stopPropagation()}
            >

                <button
                    className="modal-close"
                    onClick={onClose}
                    aria-label="Close appointment form"
                >
                    <i className="bi bi-x-lg"></i>
                </button>

                {!submitted ? (

                    <>

                        <div className="modal-icon">
                            <i className="bi bi-calendar2-heart"></i>
                        </div>

                        <h2 className="modal-title" id="appointment-title">
                            Book Appointment
                        </h2>

                            Schedule your consultation with

                        </p>

                        <form onSubmit={handleSubmit}>

                            <input
                                className="modal-input"
                                type="text"
                                placeholder="Your Full Name"
                                value={name}
                                onChange={e => setName(e.target.value)}
                                autoComplete="name"
                                required
                            />

                                className="modal-input"
                                type="email"
                                placeholder="Your Email Address"
                                value={email}
                                onChange={e => setEmail(e.target.value)}
                                autoComplete="email"
                                required
                            />

                                type="date"
                                value={date}
                                onChange={e => setDate(e.target.value)}
                                min={new Date().toLocaleDateString("en-CA")}
                                required
                            />

                            <button type="submit" className="modal-submit">
                                Confirm Appointment
                                <i className="bi bi-arrow-right ms-2"></i>
                            </button>

                        </form>

                    </>

                ) : (

                    <div className="success-message">

                        <i className="bi bi-check-circle-fill"></i>

                            Request Submitted!
                        </h5>

                        <p className="mb-2">

                        </small>

                        >

                )}

    );
}

/* MAIN SECTION */

function DoctorsSection() {

    const [index, setIndex] = useState(0);
    const [visibleCount, setVisibleCount] = useState(4);
    const [selectedDoctor, setSelectedDoctor] = useState(null);

    /* RESPONSIVE */

    useEffect(() => {

        function updateVisibleCount() {

            if (window.innerWidth <= 600) {
                setVisibleCount(1);
            } else if (window.innerWidth <= 1000) {
                setVisibleCount(2);
            } else {
                setVisibleCount(4);
            }

        }

        updateVisibleCount();

        window.addEventListener("resize", updateVisibleCount);

        return () => {
            window.removeEventListener("resize", updateVisibleCount);
        };

    }, []);

    /* SLIDER */

    const maxIndex = Math.max(
        0,
        doctorsData.length - visibleCount
    );

    function nextSlide() {
        setIndex(current =>
            current >= maxIndex ? 0 : current + 1
        );
    }

    function previousSlide() {
        setIndex(current =>
            current <= 0 ? maxIndex : current - 1
        );
    }

    useEffect(() => {
        setIndex(current => Math.min(current, maxIndex));
    }, [maxIndex]);

    const indicatorCount = maxIndex + 1;

    return (

        <section className="doctors-section" id="doctors">

            <div className="doctors-container">

                <header className="doctors-heading">

                    <div className="doctors-eyebrow">
                        <i className="bi bi-heart-pulse-fill"></i>
                        OUR MEDICAL TEAM
                    </div>

                    <h2 className="doctors-title">
                        Meet Our <span>Doctors</span>
                    </h2>

                    <p className="doctors-subtitle">
                        Find experienced professionals and book your appointment
                        <br className="d-none d-md-block"/>
                        with confidence and care.
                    </p>

                    <div className="title-decoration"></div>

                </header>

                <div className="doctors-carousel">

                    <button
                        className="carousel-arrow arrow-left"
                        onClick={previousSlide}
                        aria-label="Previous doctors"
                        disabled={maxIndex === 0}
                    >
                        <i className="bi bi-chevron-left"></i>
                    </button>

                    <div className="doctors-viewport">

                        <div
                            className="doctors-track"
                            style={{
                                transform: `translateX(calc(${index} * (-${100 / visibleCount}% - ${18 / visibleCount}px)))`
                            }}
                        >

                            {doctorsData.map(doctor => (

                                <DoctorCard
                                    key={doctor.id}
                                    doctor={doctor}
                                    onBook={setSelectedDoctor}
                                />

                            ))}

                        </div>

                    </div>

                    <button
                        className="carousel-arrow arrow-right"
                        onClick={nextSlide}
                        aria-label="Next doctors"
                        disabled={maxIndex === 0}
                    >
                        <i className="bi bi-chevron-right"></i>
                    </button>

                </div>

                <div className="carousel-indicators-custom">

                    {Array.from({ length: indicatorCount }, (_, i) => (

                        <button
                            key={i}
                            className={
                                "carousel-indicator " +
                                (index === i ? "active" : "")
                            }
                            onClick={() => setIndex(i)}
                            aria-label={`Go to slide ${i + 1}`}
                            aria-current={index === i ? "true" : undefined}
                        ></button>

                    ))}

                </div>

                <div className="doctors-bottom-note">
                    <i className="bi bi-shield-check"></i>
                    Professional care. Trusted specialists. Better health.
                </div>

            </div>

            {selectedDoctor && (

                <AppointmentModal
                    doctor={selectedDoctor}
                    onClose={() => setSelectedDoctor(null)}
                />

            )}

        </section>
    );
}
